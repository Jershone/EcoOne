name: Validate Omnexa deployment

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          bash -n omnexa-run
          find scripts -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Validate Python source
        run: python3 -m compileall -q connect
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          sed -i 's/^CHANGE_ME$/ci-placeholder-secret/g' .env
          sed -i 's/^TAILSCALE_HOSTNAME=$/TAILSCALE_HOSTNAME=pi.example.ts.net/' .env
          docker compose config --quiet
      - name: Check for accidentally committed secrets
        run: |
          ! grep -RInE '(sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)' --exclude-dir=.git --exclude='*.md' .
