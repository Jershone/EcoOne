name: oneos

services:
  caddy:
    image: caddy:2
    container_name: oneos-caddy
    restart: unless-stopped
    environment:
      ONEOS_DOMAIN: ${ONEOS_DOMAIN:-oneos.home.arpa}
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - portal
      - open-webui
      - nextcloud
      - vaultwarden
      - navet
      - connect
    networks:
      - oneos

  portal:
    image: nginx:alpine
    container_name: oneos-portal
    restart: unless-stopped
    volumes:
      - ./portal:/usr/share/nginx/html:ro
      - ./portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - oneos

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    container_name: oneos-open-webui
    restart: unless-stopped
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Run scripts/install.sh first}
      WEBUI_URL: https://ai.${ONEOS_DOMAIN:-oneos.home.arpa}
      ENABLE_WEBSOCKET_SUPPORT: "true"
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: user
      CORS_ALLOW_ORIGIN: https://ai.${ONEOS_DOMAIN:-oneos.home.arpa};https://${ONEOS_DOMAIN:-oneos.home.arpa}
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_AUTH_COOKIE_SECURE: "true"
      WEBUI_SESSION_COOKIE_SAME_SITE: lax
      WEBUI_AUTH_COOKIE_SAME_SITE: lax
      XFRAME_OPTIONS: SAMEORIGIN
      CONTENT_SECURITY_POLICY: "frame-ancestors 'self' https://${ONEOS_DOMAIN:-oneos.home.arpa}"
    volumes:
      - ./data/open-webui:/app/backend/data
    networks:
      - oneos

  nextcloud-db:
    image: mariadb:11.4
    container_name: oneos-nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/install.sh first}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/install.sh first}
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - oneos

  nextcloud-redis:
    image: redis:7-alpine
    container_name: oneos-nextcloud-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ./data/redis:/data
    networks:
      - oneos

  nextcloud:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:apache}
    container_name: oneos-nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/install.sh first}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-oneosadmin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Run scripts/install.sh first}
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.${ONEOS_DOMAIN:-oneos.home.arpa}
      OVERWRITEHOST: cloud.${ONEOS_DOMAIN:-oneos.home.arpa}
      OVERWRITEPROTOCOL: https
      TRUSTED_PROXIES: 172.30.0.0/24
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 1G
    volumes:
      - ./data/nextcloud:/var/www/html
    networks:
      - oneos

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: oneos-vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.${ONEOS_DOMAIN:-oneos.home.arpa}
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      # Keep the admin endpoint disabled unless you intentionally configure an ADMIN_TOKEN.
    volumes:
      - ./data/vaultwarden:/data
    networks:
      - oneos

  homeassistant:
    image: ${HOME_ASSISTANT_IMAGE:-ghcr.io/home-assistant/home-assistant:stable}
    container_name: oneos-homeassistant
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - ./data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro

  navet:
    image: ${NAVET_IMAGE:-ghcr.io/awesomestvi/navet:latest}
    container_name: oneos-navet
    restart: unless-stopped
    volumes:
      - ./data/navet:/data
    networks:
      - oneos

  connect:
    build:
      context: ./connect
    container_name: oneos-connect
    restart: unless-stopped
    environment:
      CONNECT_API_KEY: ${CONNECT_API_KEY:?Run scripts/install.sh first}
      NEXTCLOUD_URL: http://nextcloud
      NEXTCLOUD_USERNAME: ${NEXTCLOUD_CONNECT_USER:-oneos-ai}
      NEXTCLOUD_APP_PASSWORD: ${NEXTCLOUD_CONNECT_APP_PASSWORD:-}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-http://host.docker.internal:8123}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - oneos
    depends_on:
      - nextcloud

networks:
  oneos:
    name: oneos-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
